<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>文字水切り</title>

  <link
    rel="stylesheet"
    href="style.css?v=6"
  >
</head>

<body>

<main class="app">

  <header class="hero">
    <div class="eyebrow">
      MOJI SKIPPING
    </div>

    <h1>文字水切り</h1>

    <p>
      文字を引っぱって、最長飛距離を狙え。
    </p>
  </header>


  <section class="setup">

    <label
      class="character-box"
      for="characterInput"
    >
      <span>
        THROW CHARACTER
      </span>

      <input
        id="characterInput"
        type="text"
        value="水"
        autocomplete="off"
        aria-label="投げる文字"
      >
    </label>


    <div class="instruction">
      <strong>
        文字を左下へ引っぱって離す
      </strong>

      <span>
        引く方向と長さで角度・パワーが変化
      </span>
    </div>

  </section>


  <section class="stats">

    <div class="stat">
      <span>DISTANCE</span>
      <strong id="distanceValue">0.0m</strong>
    </div>

    <div class="stat">
      <span>SKIPS</span>
      <strong id="skipsValue">0</strong>
    </div>

    <div class="stat">
      <span>ANGLE</span>
      <strong id="angleValue">8°</strong>
    </div>

    <div class="stat">
      <span>POWER</span>
      <strong id="powerValue">75%</strong>
    </div>

  </section>


  <section class="game-panel">

    <canvas
      id="gameCanvas"
      width="900"
      height="540"
    ></canvas>

    <div
      id="canvasHint"
      class="canvas-hint"
    >
      文字をつかんで引っぱる
    </div>

  </section>


  <section
    id="result"
    class="result"
  >
    好きな文字を入力して挑戦してください
  </section>


  <button
    id="shareButton"
    class="share-button"
    type="button"
    hidden
  >
    Xで結果を共有
  </button>


  <p class="footer-note">
    文字の形・投射角・パワーによって記録が変化します。
  </p>

</main>


<script src="main.js?v=6"></script>

</body>
</html>
