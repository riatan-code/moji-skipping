<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文字水切り</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>文字水切り</h1>

    <p class="description">
      好きな文字を投げて、水切り記録を競おう。
    </p>

    <div class="controls">

      <input
        id="characterInput"
        type="text"
        maxlength="2"
        value="水"
        aria-label="投げる文字"
      >

      <button id="throwButton">
        投げる
      </button>

    </div>

    <canvas
      id="gameCanvas"
      width="900"
      height="400"
    ></canvas>

    <div id="result">
      文字を入力して投げてください
    </div>

  </main>

  <script src="main.js?v=2"></script>

</body>
</html>
